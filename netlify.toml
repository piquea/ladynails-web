[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Fotos y logo: el navegador los guarda 7 días (menos descargas = menos créditos de Netlify)
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
